name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --require-hashes -r requirements-macos-arm64.lock
      - run: pip install --no-deps -e .
      - run: pip install "pytest>=8,<9" "ruff>=0.6,<1" "pytest-qt>=4.4,<5"
      - run: python -m pytest -m "not network" tests/
      - run: python -m ruff check src tests
